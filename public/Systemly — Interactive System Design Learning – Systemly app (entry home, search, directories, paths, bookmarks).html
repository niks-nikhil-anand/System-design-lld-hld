<body>
  <div id="__bundler_placeholder">Loading Systemly — Learn system design visually...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0px; border: 1px solid var(--border); background: var(--surface); cursor: pointer\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 7h16M4 12h16M4 17h16\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{menuOpen}}\" hint-placeholder-val=\"{{false}}\">\n<nav aria-label=\"Mobile\" style=\"border-top: 1px solid var(--border); padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 2px; background: var(--bg)\">\n<sc-for list=\"{{navItems}}\" as=\"n\" hint-placeholder-count=\"5\">\n<a href=\"#nav\" sc-camel-on-click=\"{{n.open}}\" class=\"sy-ghost\" style=\"padding: 12px; border-radius: 8px; text-decoration: none; color: var(--text); font-weight: 500\">{{n.label}}<\u002Fa>\n<\u002Fsc-for>\n<a href=\"#playground\" sc-camel-on-click=\"{{goPlayground}}\" class=\"sy-ghost\" style=\"padding: 12px; border-radius: 8px; text-decoration: none; color: var(--text); font-weight: 500\">Playground<\u002Fa>\n<div style=\"display: flex; gap: 8px; padding-top: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{openSignin}}\" style=\"flex: 1; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 500\">Sign in<\u002Fbutton>\n<a href=\"#start\" sc-camel-on-click=\"{{getStarted}}\" style=\"flex: 1; height: 44px; border-radius: 10px; background: var(--accent); color: var(--accentText); text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center\">Get started<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n<\u002Fsc-if>\n<\u002Fheader>\n\n<main id=\"top\">\n\n<!-- ============ HOME ============ -->\n<sc-if value=\"{{v.home}}\" hint-placeholder-val=\"{{true}}\">\n<div>\n\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 56px 20px 40px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<span style=\"align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; color: var(--muted)\"><span style=\"width: 7px; height: 7px; border-radius: 50%; background: var(--ok)\"><\u002Fspan>20 concepts · 15 algorithms · 10 case studies<\u002Fspan>\n<h1 style=\"margin: 0; font-size: clamp(36px, 5.4vw, 60px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 700; text-wrap: balance\">Understand System Design. See It in Action.<\u002Fh1>\n<p style=\"margin: 0; font-size: 18px; color: var(--muted); max-width: 540px; text-wrap: pretty\">Learn how real-world systems work through interactive diagrams, animated request flows, and hands-on architecture experiments.<\u002Fp>\n<div style=\"position: relative; max-width: 560px\">\n<label for=\"hero-search\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Search concepts, algorithms, companies and case studies<\u002Flabel>\n<div style=\"display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow)\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n<input id=\"hero-search\" type=\"search\" autocomplete=\"off\" placeholder=\"Try “load balancer”, “Dijkstra” or “Netflix”\" value=\"{{heroQ}}\" sc-camel-on-change=\"{{onHeroInput}}\" sc-camel-on-key-down=\"{{onHeroKey}}\" role=\"combobox\" aria-expanded=\"{{heroOpen}}\" aria-controls=\"hero-results\" style=\"flex: 1; min-width: 0; height: 100%; border: 0; outline: none; }<\u002Fspan><\u002Fh2>\n<ul style=\"margin: 0; padding: 0; list-style: none; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); overflow: hidden\">\n<sc-for list=\"{{m.items}}\" as=\"it\" hint-placeholder-count=\"3\">\n<li style=\"display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: {{it.divider}}\">\n<button type=\"button\" sc-camel-on-click=\"{{it.toggle}}\" aria-pressed=\"{{it.done}}\" aria-label=\"{{it.toggleLabel}}\" style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; border: 1.5px solid {{it.checkBorder}}; background: {{it.checkBg}}; color: var(--accentText); cursor: pointer; display: flex; align-items: center; justify-content: center\"><sc-if value=\"{{it.done}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><\u002Fbutton>\n<a href=\"#open\" sc-camel-on-click=\"{{it.open}}\" style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; text-decoration: none; color: var(--text)\"><span style=\"font-weight: 550\">{{it.title}}<\u002Fspan><span style=\"font-size: 12.5px; color: var(--muted)\">{{it.kindLabel}} · {{it.meta}}<\u002Fspan><\u002Fa>\n<svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<\u002Fsection>\n<\u002Fsc-for>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ BOOKMARKS ============ -->\n<sc-if value=\"{{v.bookmarks}}\" hint-placeholder-val=\"{{false}}\">\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 32px 20px 72px; display: flex; flex-direction: column; gap: 20px\">\n<nav aria-label=\"Breadcrumb\" style=\"font-size: 13px; color: var(--muted); display: flex; gap: 6px\"><a href=\"#home\" sc-camel-on-click=\"{{goHome}}\" style=\"text-decoration: none\">Home<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><span>Bookmarks<\u002Fspan><\u002Fnav>\n<h1 style=\"margin: 0; font-size: 34px; letter-spacing: -0.03em\">Bookmarks<\u002Fh1>\n<sc-if value=\"{{hasBookmarks}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 14px\">\n<sc-for list=\"{{bookmarkItems}}\" as=\"r\" hint-placeholder-count=\"3\">\n<article style=\"display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface)\">\n<span style=\"font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted)\">{{r.kindLabel}}<\u002Fspan>\n<h2 style=\"margin: 0; font-size: 17px\">{{r.title}}<\u002Fh2>\n<p style=\"margin: 0; font-size: 14px; color: var(--muted)\">{{r.blurb}}<\u002Fp>\n<div style=\"display: flex; gap: 8px; margin-top: auto\">\n<a href=\"#open\" sc-camel-on-click=\"{{r.open}}\" class=\"sy-primary\" style=\"display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 9px; background: var(--accent); color: var(--accentText); text-decoration: none; font-weight: 600; font-size: 13px\">Open<\u002Fa>\n<button type=\"button\" sc-camel-on-click=\"{{r.bookmark}}\" class=\"sy-ghost\" style=\"height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13px\">Remove<\u002Fbutton>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{noBookmarks}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 32px; border-radius: 16px; border: 1px dashed var(--border); background: var(--surface)\">\n<h2 style=\"margin: 0; font-size: 20px\">Nothing saved yet<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted); max-width: 520px\">Use the bookmark icon on any concept, algorithm, company or case study. Bookmarks are stored in this browser only.<\u002Fp>\n<a href=\"#explore\" sc-camel-on-click=\"{{goExplore}}\" style=\"display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: var(--accentText); text-decoration: none; font-weight: 600\">Browse all topics<\u002Fa>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ ABOUT / LEGAL ============ -->\n<sc-if value=\"{{v.about}}\" hint-placeholder-val=\"{{false}}\">\n<section style=\"max-width: 760px; margin: 0 auto; padding: 32px 20px 72px; display: flex; flex-direction: column; gap: 18px\">\n<nav aria-label=\"Breadcrumb\" style=\"font-size: 13px; color: var(--muted); display: flex; gap: 6px\"><a href=\"#home\" sc-camel-on-click=\"{{goHome}}\" style=\"text-decoration: none\">Home<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><span>About &amp; legal<\u002Fspan><\u002Fnav>\n<h1 style=\"margin: 0; font-size: 34px; letter-spacing: -0.03em\">About Systemly<\u002Fh1>\n<h2 id=\"content-notes\" style=\"margin: 12px 0 0; font-size: 20px\">Content notes<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted)\">Company pages present simplified educational models assembled from public engineering talks, papers and blog posts. They are not verified descriptions of any company's internal systems, and no company listed endorses or is affiliated with Systemly. Company names appear as plain text for identification only.<\u002Fp>\n<h2 id=\"privacy\" style=\"margin: 12px 0 0; font-size: 20px\">Privacy<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted)\">This prototype has no backend. Bookmarks, learned topics, recent searches and your theme choice are stored in your browser's local storage and never leave your device. Clearing site data removes them.<\u002Fp>\n<h2 id=\"terms\" style=\"margin: 12px 0 0; font-size: 20px\">Terms<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted)\">Content is provided for learning and interview preparation, as-is. Capacity numbers in case studies are worked estimates to practise reasoning, not benchmarks.<\u002Fp>\n<h2 id=\"contact\" style=\"margin: 12px 0 0; font-size: 20px\">Contact<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted)\">[YOUR CONTACT EMAIL] · Source: [YOUR REPOSITORY URL]<\u002Fp>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<footer style=\"border-top: 1px solid var(--border); background: var(--surface)\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 40px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 28px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-weight: 650; font-size: 16px\">Systemly<\u002Fspan>\n<span style=\"font-size: 13px; color: var(--muted)\">Interactive system design, distributed systems and algorithms — one animated step at a time.<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{footerCols}}\" as=\"col\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 12px; font-family: 'Geist Mono', ui-monospace, monospace; letter-spacing: .06em; color: var(--muted)\">{{col.title}}<\u002Fspan>\n<sc-for list=\"{{col.links}}\" as=\"l\" hint-placeholder-count=\"4\"><a href=\"#footer\" sc-camel-on-click=\"{{l.open}}\" style=\"font-size: 14px; text-decoration: none; color: var(--text)\">{{l.label}}<\u002Fa><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 16px 20px 28px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--border)\">Company names are used for identification in educational examples only. GitHub: [YOUR REPOSITORY URL]<\u002Fdiv>\n<\u002Ffooter>\n\n<!-- ============ SEARCH PALETTE ============ -->\n<sc-if value=\"{{searchOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"position: fixed; inset: 0; z-index: 100; display: flex; justify-content: center; align-items: flex-start; padding: 72px 16px 16px\">\n<button type=\"button\" sc-camel-on-click=\"{{closeSearch}}\" aria-label=\"Close search\" style=\"position: absolute; inset: 0; border: 0; background: rgba(10,10,20,.45); cursor: default\"><\u002Fbutton>\n<div role=\"dialog\" aria-modal=\"true\" aria-label=\"Search\" style=\"position: relative; width: 100%; max-width: 640px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); overflow: hidden\">\n<div style=\"display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 56px; border-bottom: 1px solid var(--border)\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n<input ref=\"{{setSearchRef}}\" type=\"search\" aria-label=\"Search topics\" role=\"combobox\" aria-expanded=\"true\" aria-controls=\"palette-list\" placeholder=\"Search companies, concepts, algorithms, case studies, paths\" value=\"{{query}}\" sc-camel-on-change=\"{{onQuery}}\" sc-camel-on-key-down=\"{{onPaletteKey}}\" style=\"flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-size: 16px\">\n<span style=\"font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted); padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px\">esc<\u002Fspan>\n<\u002Fdiv>\n<div style=\"max-height: 60vh; overflow-y: auto; padding: 8px\">\n<sc-if value=\"{{palette.showRecent}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"padding: 6px 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between\"><span>Recent searches<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{clearRecent}}\" style=\"border: 0; background: transparent; color: var(--accent); cursor: pointer; font-size: 12px\">Clear<\u002Fbutton><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px\">\n<sc-for list=\"{{palette.recent}}\" as=\"rq\" hint-placeholder-count=\"3\"><button type=\"button\" sc-camel-on-click=\"{{rq.run}}\" style=\"height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; font-size: 13px\">{{rq.label}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{palette.showSuggest}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"padding: 6px 10px; font-size: 12px; color: var(--muted)\">Suggestions<\u002Fdiv>\n<\u002Fsc-if>\n<ul id=\"palette-list\" role=\"listbox\" style=\"margin: 0; padding: 0; list-style: none\">\n<sc-for list=\"{{palette.results}}\" as=\"r\" hint-placeholder-count=\"6\">\n<li role=\"option\" aria-selected=\"{{r.active}}\"><a href=\"#result\" sc-camel-on-click=\"{{r.open}}\" style=\"display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; text-decoration: none; color: var(--text); background: {{r.bg}}\">\n<span style=\"font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); width: 100px; flex-shrink: 0\">{{r.kindLabel}}<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; min-width: 0\"><span style=\"font-weight: 550\">{{r.title}}<\u002Fspan><span style=\"font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{r.blurb}}<\u002Fspan><\u002Fspan>\n<\u002Fa><\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<sc-if value=\"{{palette.empty}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"padding: 24px 12px; text-align: center; color: var(--muted); font-size: 14px\">No results for “{{query}}”. Try “cache”, “graph” or “queue”.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted)\">\n<span>↑ ↓ to move · Enter to open<\u002Fspan>\n<a href=\"#search\" sc-camel-on-click=\"{{paletteSeeAll}}\" style=\"text-decoration: none; font-weight: 600\">See all results with filters →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ SIGN IN ============ -->\n<sc-if value=\"{{signinOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px\">\n<button type=\"button\" sc-camel-on-click=\"{{closeSignin}}\" aria-label=\"Close\" style=\"position: absolute; inset: 0; border: 0; background: rgba(10,10,20,.45); cursor: default\"><\u002Fbutton>\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"signin-h\" style=\"position: relative; width: 100%; max-width: 420px; padding: 24px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 14px\">\n<h2 id=\"signin-h\" style=\"margin: 0; font-size: 20px\">Accounts arrive with the API<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted); font-size: 14px\">This prototype runs without a backend, so there's nothing to sign in to yet. Your bookmarks and progress are already saved in this browser — {{bookmarkCount}} bookmarks and {{learnedCount}} learned topics so far.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<a href=\"#start\" sc-camel-on-click=\"{{getStarted}}\" class=\"sy-primary\" style=\"display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: var(--accentText); text-decoration: none; font-weight: 600\">Start the Fundamentals path<\u002Fa>\n<button type=\"button\" sc-camel-on-click=\"{{closeSignin}}\" style=\"height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer\">Keep browsing<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;auto&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6400}}\">\nconst KIND_LABEL = { concept: 'Concept', algorithm: 'Algorithm', company: 'Company', case: 'System design', path: 'Learning path' };\nconst KIND_VIEW = { concept: 'concept', algorithm: 'algorithm', company: 'company', case: 'case', path: 'path' };\nconst DIFF_RANK = { Beginner: 0, Intermediate: 1, Advanced: 2 };\n\nfunction C(slug, title, blurb, cat, diff, mins, tags, preview) { return { kind: 'concept', slug, title, blurb, cat, diff, mins, tags, preview }; }\nconst CONCEPTS = [\n  C('load-balancer', 'Load Balancer', 'Spreads incoming requests across healthy servers so no single machine is overwhelmed.', 'Traffic', 'Beginner', 12, ['availability', 'round robin', 'health checks', 'l4', 'l7'], ['Client', 'LB', 'Server ×3']),\n  C('api-gateway', 'API Gateway', 'A single entry point that authenticates, routes and shapes requests to backend services.', 'Traffic', 'Intermediate', 14, ['auth', 'routing', 'microservices', 'bff'], ['Client', 'Gateway', 'Services']),\n  C('reverse-proxy', 'Reverse Proxy', 'Sits in front of your apps to terminate TLS, cache responses and hide origin servers.', 'Networking', 'Beginner', 10, ['nginx', 'tls', 'proxy', 'origin'], ['Client', 'Proxy', 'App']),\n  C('cdn', 'CDN', 'Edge servers near users cache static and media content to cut latency and origin load.', 'Networking', 'Beginner', 11, ['edge', 'cache', 'latency', 'static assets', 'video'], ['User', 'Edge', 'Origin']),\n  C('dns', 'DNS', 'Turns human-readable names into IP addresses through a chain of resolvers and name servers.', 'Networking', 'Beginner', 10, ['domain', 'resolver', 'ttl', 'networking'], ['Browser', 'Resolver', 'NS']),\n  C('caching', 'Caching', 'Keeps hot data in fast memory so repeated reads skip the slow database.', 'Data', 'Beginner', 12, ['cache aside', 'write through', 'ttl', 'lru', 'invalidation'], ['App', 'Cache', 'DB']),\n  C('redis', 'Redis', 'An in-memory data-structure store used for caching, counters, sessions and pub/sub.', 'Data', 'Intermediate', 13, ['in-memory', 'cache', 'pubsub', 'key value'], ['API', 'Redis', 'Replica']),\n  C('sql-vs-nosql', 'SQL vs NoSQL', 'Relational schemas and transactions versus flexible, horizontally partitioned stores.', 'Data', 'Beginner', 15, ['database', 'postgres', 'mongodb', 'acid', 'schema'], ['App', 'SQL', 'NoSQL']),\n  C('db-replication', 'Database Replication', 'Copies data from a primary to replicas for read scaling and failover.', 'Data', 'Intermediate', 14, ['primary', 'replica', 'failover', 'lag', 'database'], ['Primary', 'Replica ×2']),\n  C('db-sharding', 'Database Sharding', 'Splits one dataset across many databases using a shard key.', 'Data', 'Advanced', 16, ['partitioning', 'shard key', 'hotspot', 'database'], ['Router', 'Shard ×3']),\n  C('message-queues', 'Message Queues', 'Buffers work between producers and consumers so traffic spikes don’t overwhelm services.', 'Messaging', 'Intermediate', 12, ['queue', 'sqs', 'rabbitmq', 'async', 'dlq', 'retry'], ['Producer', 'Queue', 'Workers']),\n  C('kafka', 'Kafka', 'A partitioned, replayable commit log for high-throughput event streams.', 'Messaging', 'Advanced', 18, ['streaming', 'partitions', 'consumer group', 'offsets', 'log'], ['Producer', 'Partitions', 'Consumers']),\n  C('rate-limiting', 'Rate Limiting', 'Caps how many requests a client can make in a window to protect capacity.', 'Traffic', 'Intermediate', 11, ['token bucket', '429', 'throttling', 'abuse'], ['Client', 'Limiter', 'API']),\n  C('consistent-hashing', 'Consistent Hashing', 'Maps keys to nodes on a ring so adding a node moves only a fraction of keys.', 'Data', 'Advanced', 15, ['hash ring', 'partitioning', 'virtual nodes', 'distributed cache'], ['Key', 'Ring', 'Node']),\n  C('scaling', 'Horizontal vs Vertical Scaling', 'Bigger machines versus more machines — and why most systems end up doing both.', 'Architecture', 'Beginner', 10, ['scale up', 'scale out', 'capacity', 'stateless'], ['Users', 'LB', 'Servers']),\n  C('microservices', 'Microservices', 'Splits an application into independently deployable services owned by small teams.', 'Architecture', 'Intermediate', 16, ['services', 'monolith', 'deployment', 'domain'], ['Gateway', 'Services', 'DBs']),\n  C('websockets', 'WebSockets', 'A persistent, two-way connection for pushing real-time updates to clients.', 'Networking', 'Intermediate', 12, ['real-time', 'push', 'chat', 'presence', 'upgrade'], ['Client', 'WS Server', 'Pub/Sub']),\n  C('event-driven', 'Event-Driven Architecture', 'Services publish facts as events; others react without being called directly.', 'Messaging', 'Intermediate', 14, ['events', 'pubsub', 'decoupling', 'async'], ['Service', 'Event bus', 'Subscribers']),\n  C('cap-theorem', 'CAP Theorem', 'During a network partition, a distributed store must choose consistency or availability.', 'Data', 'Advanced', 13, ['consistency', 'availability', 'partition', 'distributed'], ['Node A', '✕', 'Node B']),\n  C('circuit-breaker', 'Circuit Breaker', 'Stops calling a failing dependency so one outage doesn’t cascade through the system.', 'Traffic', 'Intermediate', 11, ['resilience', 'fail fast', 'half-open', 'retries'], ['Service', 'Breaker', 'Dependency'])\n];\n\nfunction A(slug, title, blurb, diff, time, space, tags, mini) { return { kind: 'algorithm', slug, title, blurb, cat: tags[0], diff, time, space, tags, mini, mins: 10 }; }\nconst ALGORITHMS = [\n  A('binary-search', 'Binary Search', 'Find a value in a sorted array by halving the search range.', 'Beginner', 'O(1) best · O(log n) avg/worst', 'O(1)', ['Searching', 'sorted', 'divide and conquer'], [2, 3, 4, 5, 6, 7, 8, 9]),\n  A('merge-sort', 'Merge Sort', 'Stable sort: split in halves, sort each, merge in order.', 'Intermediate', 'O(n log n) best/avg/worst', 'O(n)', ['Sorting', 'stable', 'divide and conquer'], [5, 2, 8, 3, 9, 1, 6, 4]),\n  A('quick-sort', 'Quick Sort', 'Partition around a pivot, then recurse on both sides.', 'Intermediate', 'O(n log n) avg · O(n²) worst', 'O(log n)', ['Sorting', 'in-place', 'pivot'], [7, 3, 9, 2, 5, 8, 1, 6]),\n  A('bfs', 'Breadth-First Search', 'Explore a graph level by level; shortest path in unweighted graphs.', 'Beginner', 'O(V + E)', 'O(V)', ['Graphs', 'queue', 'shortest path'], [3, 5, 5, 7, 7, 7, 9, 9]),\n  A('dfs', 'Depth-First Search', 'Go as deep as possible before backtracking; cycles, components.', 'Beginner', 'O(V + E)', 'O(V)', ['Graphs', 'stack', 'recursion'], [9, 7, 5, 3, 5, 7, 4, 6]),\n  A('dijkstra', 'Dijkstra’s Algorithm', 'Shortest paths from one source with non-negative edge weights.', 'Intermediate', 'O((V + E) log V)', 'O(V)', ['Graphs', 'shortest path', 'priority queue', 'weighted'], [2, 4, 3, 6, 5, 7, 6, 9]),\n  A('a-star', 'A* Search', 'Shortest path guided by a heuristic toward the goal.', 'Advanced', 'O(E log V) worst', 'O(V)', ['Graphs', 'heuristic', 'pathfinding', 'grid'], [9, 8, 7, 6, 5, 4, 3, 2]),\n  A('sliding-window', 'Sliding Window', 'Maintain a moving range over an array instead of recomputing it.', 'Beginner', 'O(n)', 'O(1)', ['Arrays', 'subarray', 'window'], [4, 6, 6, 6, 3, 5, 7, 2]),\n  A('two-pointers', 'Two Pointers', 'Move two indices toward each other to find a pair in sorted data.', 'Beginner', 'O(n)', 'O(1)', ['Arrays', 'sorted', 'pair sum'], [1, 2, 3, 5, 6, 7, 8, 9]),\n  A('dynamic-programming', 'Dynamic Programming', 'Solve overlapping subproblems once and reuse them — coin change.', 'Intermediate', 'O(n · amount)', 'O(amount)', ['Dynamic programming', 'memoization', 'tabulation', 'coin change'], [1, 2, 2, 3, 3, 4, 4, 5]),\n  A('trie', 'Trie', 'Prefix tree for fast autocomplete and prefix lookups.', 'Intermediate', 'O(L) insert/search', 'O(total characters)', ['Trees', 'prefix', 'autocomplete', 'strings'], [8, 6, 6, 4, 4, 4, 2, 2]),\n  A('union-find', 'Union-Find', 'Track connected components with near-constant merges.', 'Intermediate', 'O(α(n)) amortized', 'O(n)', ['Graphs', 'disjoint set', 'components', 'kruskal'], [3, 3, 6, 6, 6, 8, 8, 8]),\n  A('topological-sort', 'Topological Sort', 'Order tasks so every dependency comes first (Kahn’s algorithm).', 'Intermediate', 'O(V + E)', 'O(V)', ['Graphs', 'dag', 'dependencies', 'scheduling'], [2, 3, 4, 5, 6, 7, 8, 9]),\n  A('kmp', 'KMP String Matching', 'Find a pattern in text without re-scanning characters.', 'Advanced', 'O(n + m)', 'O(m)', ['Strings', 'pattern matching', 'prefix function'], [5, 5, 3, 5, 5, 3, 5, 5]),\n  A('consistent-hashing', 'Consistent Hashing', 'Place keys and servers on a ring; lookups walk clockwise.', 'Advanced', 'O(log N) lookup', 'O(N · v)', ['Hashing', 'hash ring', 'distributed', 'partitioning'], [3, 7, 4, 8, 5, 9, 6, 2])\n];\n\nfunction CO(slug, title, blurb, focus, topics) { return { kind: 'company', slug, title, blurb, cat: 'Company', diff: 'Intermediate', mins: 20, tags: focus, topics }; }\nconst COMPANIES = [\n  CO('google', 'Google', 'Web-scale search, indexing pipelines and globally distributed storage.', ['search', 'indexing', 'mapreduce', 'distributed storage', 'caching'], 11),\n  CO('amazon', 'Amazon', 'Shopping carts, order pipelines and highly available key-value storage.', ['e-commerce', 'dynamo', 'queues', 'microservices'], 11),\n  CO('netflix', 'Netflix', 'Video streaming, CDN delivery, resilience engineering and recommendations.', ['streaming', 'cdn', 'caching', 'circuit breaker', 'recommendations'], 10),\n  CO('meta'  fallback; } catch (e) { return fallback; } }\nfunction save(key, value) { try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }\nfunction reducedMotion() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }\nfunction prefersDark() { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; } }\n\nconst ASPECT = 56;\nfunction pt(x, y) { return { left: x + '%', top: (y / ASPECT * 100) + '%' }; }\nfunction edge(a, b, color, aspect) {\n  const asp = aspect || ASPECT;\n  const dx = b.x - a.x, dy = b.y - a.y;\n  return { left: a.x + '%', top: (a.y / asp * 100) + '%', width: Math.sqrt(dx * dx + dy * dy) + '%', angle: Math.atan2(dy, dx) + 'rad', color };\n}\n\nfunction score(item, tokens) {\n  let total = 0;\n  for (const t of tokens) {\n    let s = 0;\n    const title = item.title.toLowerCase();\n    const stem = t.length > 4 ? t.replace(/(ing|es|e|s)$/, '') : t;\n    if (title.startsWith(t) || title.startsWith(stem)) s += 15; else if (title.includes(t) || title.includes(stem)) s += 10;\n    if (item.tags.some((g) => g.toLowerCase().includes(t))) s += 6;\n    if ((item.cat || '').toLowerCase().includes(t)) s += 4;\n    if (KIND_LABEL[item.kind].toLowerCase().includes(t)) s += 3;\n    if (item.blurb.toLowerCase().includes(t)) s += 2;\n    if (s === 0) return 0;\n    total += s;\n  }\n  return total;\n}\nfunction search(q) {\n  const tokens = q.toLowerCase().trim().split(/\\s+/).filter(Boolean);\n  if (!tokens.length) return [];\n  return ALL.map((it) => ({ it, s: score(it, tokens) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s).map((x) => x.it);\n}\n\nconst TYPE_PRESETS = {\n  all: { heading: 'Explore all topics', sub: 'Search and filter every concept, algorithm, company and case study.' },\n  concept: { heading: 'System design concepts', sub: 'Twenty building blocks, each with an animated step-by-step flow.' },\n  algorithm: { heading: 'Algorit  e.preventDefault(); this.setState({ activeIdx: Math.min(this.state.activeIdx + 1, list.length - 1) }); }\n        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ activeIdx: Math.max(this.state.activeIdx - 1, 0) }); }\n        else if (e.key === 'Enter') { e.preventDefault(); const it = list[Math.min(this.state.activeIdx, list.length - 1)]; if (it) { this.addRecentFor(this.state.query || it.title); this.go(KIND_VIEW[it.kind], it.slug); } else if (this.state.query.trim()) this.submitSearch(this.state.query); }\n        else if (e.key === 'Escape') { this.setState({ searchOpen: false }); }\n      },\n      paletteSeeAll: (e) => { nav(e); this.submitSearch(this.state.query); },\n      onHeroInput: (e) => this.setState({ heroQ: e.target.value, heroIdx: -1 }),\n      onHeroKey: (e) => {\n        const list = this.heroList();\n        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ heroIdx: Math.min(this.state.heroIdx + 1, list.length - 1) }); }\n        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ heroIdx: Math.max(this.state.heroIdx - 1, -1) }); }\n        else if (e.key === 'Enter') { e.preventDefault(); const it = list[this.state.heroIdx]; if (it && this.state.heroIdx >= 0) this.openItem(it); else this.submitSearch(this.state.heroQ); }\n        else if (e.key === 'Escape') { this.setState({ heroQ: '' }); }\n      },\n      submitHero: () => this.submitSearch(this.state.heroQ),\n      onExQ: (e) => this.setState({ ex: { ...this.state.ex, q: e.target.value } }),\n      onExKey: (e) => { if (e.key === 'Enter') this.addRecentFor(this.state.ex.q); },\n      clearExQ: () => this.setState({ ex: { ...this.state.ex, q: '' } }),\n      onExDiff: (e) => this.setState({ ex: { ...this.state.ex, diff: e.target.value } }),\n      onExSort: (e) => this.setState({ ex: { ...this.state.ex, sort: e.target.value } }),\n      resetEx: () => this.setState({ ex: { q: '', type: 'all', diff: 'all', sort: 'relevance' } })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
